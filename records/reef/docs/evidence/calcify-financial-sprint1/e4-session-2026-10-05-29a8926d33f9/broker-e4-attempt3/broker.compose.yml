x-broker: &broker
  image: redpandadata/redpanda@sha256:9e83cfa99278f30d0133271c26bf670cd69c94ffa6ba0b42830dd0c3bd9dcfd9
  labels:
    reef.test: calcify-financial-sprint1
  mem_limit: 2g
  cpus: 1
  healthcheck:
    test: ["CMD", "rpk", "cluster", "info", "-X", "brokers=127.0.0.1:9092"]
    interval: 3s
    timeout: 2s
    retries: 30
services:
  rp0:
    <<: *broker
    volumes: ["rp0-data:/var/lib/redpanda/data"]
    ports: ["127.0.0.1:40092:40092"]
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--check=false", "--node-id", "0", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:40092", "--advertise-kafka-addr", "internal://rp0:9092,external://127.0.0.1:40092", "--rpc-addr", "0.0.0.0:33145", "--advertise-rpc-addr", "rp0:33145", "--seeds", "rp0:33145"]
  rp1:
    <<: *broker
    volumes: ["rp1-data:/var/lib/redpanda/data"]
    ports: ["127.0.0.1:40192:40192"]
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--check=false", "--node-id", "1", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:40192", "--advertise-kafka-addr", "internal://rp1:9092,external://127.0.0.1:40192", "--rpc-addr", "0.0.0.0:33145", "--advertise-rpc-addr", "rp1:33145", "--seeds", "rp0:33145"]
  rp2:
    <<: *broker
    volumes: ["rp2-data:/var/lib/redpanda/data"]
    ports: ["127.0.0.1:40292:40292"]
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "1G", "--reserve-memory", "0M", "--check=false", "--node-id", "2", "--kafka-addr", "internal://0.0.0.0:9092,external://0.0.0.0:40292", "--advertise-kafka-addr", "internal://rp2:9092,external://127.0.0.1:40292", "--rpc-addr", "0.0.0.0:33145", "--advertise-rpc-addr", "rp2:33145", "--seeds", "rp0:33145"]

volumes:
  rp0-data:
    labels:
      reef.test: calcify-financial-sprint1
  rp1-data:
    labels:
      reef.test: calcify-financial-sprint1
  rp2-data:
    labels:
      reef.test: calcify-financial-sprint1
